<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>직장비교 스토어 스크린샷 프레임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* 스토어 스크린샷 1080x1920 캔버스.
     앱 화면은 이미지가 아니라 iframe을 확대해서 넣는다 — 412px 화면을 1.82배로 늘리면
     iframe이 그 배율로 다시 렌더링되므로 이미지 확대와 달리 글자가 뭉개지지 않는다. */
  :root {
    --field: #081739;      /* 앱 네이비보다 더 깊게 — 앱 화면(#F4F6FA)이 떠 보이게 */
    --paper: #f4f6fa;      /* 앱 배경색 그대로 가져온 헤드라인 색 */
    --signal:#ffc53d;      /* 프레임당 한 단어에만 쓰는 유일한 난색 */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: var(--field);
    font-family: Pretendard, -apple-system, "Malgun Gothic", sans-serif;
    position: relative;
  }
  .copy { position: absolute; top: 104px; left: 84px; right: 84px; z-index: 2; }
  h1 {
    font-size: 84px; line-height: 1.16; font-weight: 900;
    letter-spacing: -.05em; color: var(--paper);
    white-space: pre-line;
  }
  h1 em { font-style: normal; color: var(--signal); }
  .sub {
    margin-top: 26px; font-size: 33px; line-height: 1.5; font-weight: 400;
    letter-spacing: -.03em; color: rgba(244,246,250,.62); max-width: 840px;
  }
  .device {
    position: absolute; left: 84px; top: 560px;
    width: 750px; height: 1666px;
    border-radius: 42px; overflow: hidden;
    background: var(--paper);
    box-shadow: 0 60px 120px -30px rgba(0,0,0,.65), 0 0 0 1px rgba(93,140,255,.22);
    z-index: 1; isolation: isolate;
  }
  /* 앱 화면은 캔버스 아래로 흘러나가며 잘린다. 잘린 단면을 배경색으로 녹여
     의도된 크롭으로 보이게 한다 — 화면 밖이 아니라 캔버스 바닥 기준이어야 한다. */
  .fade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 260px; z-index: 3;
    background: linear-gradient(to bottom, rgba(8,23,57,0), var(--field));
    pointer-events: none;
  }
  .device iframe {
    width: 412px; height: 915px; border: 0;
    transform: scale(1.8204); transform-origin: top left;
  }
</style>
</head>
<body>
<div class="copy">
  <h1 id="headline"></h1>
  <p class="sub" id="sub"></p>
</div>
<div class="device"><iframe id="app" title="앱 화면"></iframe></div>
<div class="fade"></div>

<script>
var JOBS = [
  {id:"j1",name:"(주)한빛물류 서초센터",pay:{amount:295,unit:"monthly"},start:"09:00",end:"18:00",daysPerWeek:5,commuteMin:25,breakMin:60,intensity:"normal",employmentType:"regular",insurance:true,weekendWork:false,sourceUrl:null},
  {id:"j2",name:"밝은미소치과 데스크",pay:{amount:265,unit:"monthly"},start:"09:30",end:"19:00",daysPerWeek:5,commuteMin:15,breakMin:60,intensity:"easy",employmentType:"regular",insurance:true,weekendWork:false,sourceUrl:null},
  {id:"j3",name:"CU 역삼점 주간",pay:{amount:11200,unit:"hourly"},start:"08:00",end:"16:00",daysPerWeek:6,commuteMin:10,breakMin:30,intensity:"easy",employmentType:"contract",insurance:false,weekendWork:true,sourceUrl:null},
  {id:"j4",name:"대성이앤씨 생산직",pay:{amount:330,unit:"monthly"},start:"07:00",end:"19:00",daysPerWeek:5,commuteMin:55,breakMin:60,intensity:"hard",employmentType:"regular",insurance:true,weekendWork:false,sourceUrl:null}
];
var PARENTING = {pay:3,commute:5,endTime:5,startTime:4,days:4,intensity:3,stability:2};
var NO_LIMITS = {minPay:null,maxEndTime:null,maxCommute:null,maxDays:null};
var PASTE_TEXT = '(주)해성식품 제조 생산직\n급여 일급 100,620원\n근무요일 주5일 (월~금)\n근무시간 08:00~17:00\n서울 강서구 마곡동';

// 설치 결정에 미치는 영향이 큰 순서 — 핵심가치(1) → 공고 조달(2) → 진입장벽 해소(3) →
// 차별화 인사이트(4) → 개인화(5) → 상세비교(6) → 스마트필터(7) → 신뢰 마감(8).
// 2026-11-18: "공고 찾기"(2)를 넣고 템플릿 버튼 프레임을 뺐다 — 템플릿은 5번(별점 조정)과
// 같은 메시지였고, 공고 찾기는 "내가 공고를 다 입력해야 하나"라는 설치 직전의 망설임을 없앤다.
var FRAMES = {
  1: { head:'공고 세 개, 뭐가 제일\n<em>나은</em> 건지 헷갈릴 때',
       sub:'급여·통근·퇴근시각을 내 기준대로 채점해 순위를 매깁니다.',
       limits:NO_LIMITS, view:'home' },
  2: { head:'공고를 <em>앱 안에서</em>\n찾아 바로 담기',
       sub:'공공기관 채용공고를 지역별 마감 임박순으로. 누르면 비교 목록에 바로 들어갑니다.',
       limits:NO_LIMITS, view:'feed' },
  3: { head:'공고 글 복사해서\n<em>붙여넣기</em> 한 번이면 끝',
       sub:'급여·근무시간·요일을 알아서 채웁니다. 일급도 월급으로 환산해 둡니다.',
       limits:NO_LIMITS, view:'paste' },
  4: { head:'시급·월급·연봉\n<em>실수령액</em>까지 한 번에',
       sub:'4대보험료와 세금 뗀 진짜 받는 돈을, 계산기 없이 앱 안에서 바로 확인하세요.',
       limits:NO_LIMITS, view:'calculator' },
  5: { head:'중요한 건\n<em>사람마다</em> 다릅니다',
       sub:'별점을 옮기면 순위가 그 자리에서 바뀝니다. 내 우선순위대로.',
       limits:NO_LIMITS, view:'criteria' },
  6: { head:'궁금했던 걸\n<em>한 표</em>에 나란히',
       sub:'월급·실질시급·통근·업무강도·주말근무까지 눈으로 직접 비교하세요.',
       limits:NO_LIMITS, view:'compare' },
  7: { head:'못 맞추는 조건은\n<em>아예</em> 걸러냅니다',
       sub:'퇴근 18시 30분, 통근 40분처럼 선을 그으면 넘는 공고는 사유와 함께 탈락합니다.',
       limits:{minPay:230,maxEndTime:'18:30',maxCommute:40,maxDays:5}, view:'home' },
  8: { head:'내 공고 정보는\n<em>내 폰에만</em>',
       sub:'회원가입도 서버도 없습니다. 백업과 공유도 내가 누를 때만 동작합니다.',
       limits:NO_LIMITS, view:'home-privacy' }
};

var n = Number(new URLSearchParams(location.search).get('n') || 1);
var f = FRAMES[n];
document.getElementById('headline').innerHTML = f.head;
document.getElementById('sub').textContent = f.sub;

// 같은 오리진이라 부모가 앱의 localStorage를 먼저 채워두고 iframe을 띄운다.
localStorage.setItem('jobscale.jobs', JSON.stringify(JOBS));
localStorage.setItem('jobscale.weights', JSON.stringify(PARENTING));
localStorage.setItem('jobscale.limits', JSON.stringify(f.limits));
localStorage.setItem('jobscale.feedSido', JSON.stringify('007008')); // 경기 — 마감일이 섞여 D-day 칩이 다양하게 보인다
localStorage.removeItem('jobscale.targets');

var iframe = document.getElementById('app');
function hide(doc, sel) { var el = doc.querySelector(sel); if (el) el.style.display = 'none'; }

iframe.addEventListener('load', function () {
  var doc = iframe.contentDocument;
  var win = iframe.contentWindow;

  if (f.view === 'criteria') doc.querySelector('[data-nav="criteria"]').click();
  if (f.view === 'compare') doc.querySelector('[data-nav="compare"]').click();
  if (f.view === 'paste') {
    doc.getElementById('add-job-btn').click();
    doc.getElementById('jf-paste').value = PASTE_TEXT;
    doc.getElementById('jf-paste-apply').click();
  }

  // 임금계산기: 계산기 탭으로 이동 → 월급 300만원 입력 → 계산하기 클릭.
  // 하루근무시간·주당근무일수·부양가족수 입력란은 걷어내 핵심(금액·비과세액·결과)만 보여준다.
  // scrollIntoView는 부모 프레임까지 스크롤시켜 헤드라인이 잘리므로 iframe 내부만 스크롤한다.
  if (f.view === 'calculator') {
    doc.querySelector('[data-nav="calculator"]').click();
    doc.getElementById('calc-amount').value = '300';
    ['calc-hoursPerDay', 'calc-daysPerWeek', 'calc-dependents',
     'calc-otHours', 'calc-holHoursPerDay', 'calc-holDays', 'calc-taxFree', 'calc-type'].forEach(function (id) {
      var input = doc.getElementById(id);
      if (input) input.closest('.field-row').style.display = 'none';
    });
    hide(doc, '#view-calculator > h2'); hide(doc, '.topbar h1');
    hide(doc, '#view-calculator .hint'); // 하단 고지문은 앱 안에 그대로 있다 — 잘린 채 보이면 지저분하므로 뺀다
    doc.getElementById('calc-submit-btn').click();
    var resultEl = doc.getElementById('calc-result');
    if (resultEl) win.scrollTo(0, Math.max(0, resultEl.offsetTop - 230)); // 입력칸 라벨까지 보이게
  }
  // 프라이버시: 백업/공유 버튼과 방침 링크가 보이는 하단까지 스크롤.
  // 신뢰 마감: 1위 카드는 남겨 제품감을 유지하면서, 백업/공유 버튼과 방침 링크를 바로 그 아래로 당겨온다.
  if (f.view === 'home-privacy') {
    hide(doc, '.topbar'); hide(doc, '.question'); hide(doc, '.template-row');
    hide(doc, '#job-count-label'); hide(doc, '#explain-text');
    doc.querySelectorAll('#job-list .job-card').forEach(function (el, i) { if (i > 0) el.style.display = 'none'; });
    doc.querySelector('.secondary-row').style.marginTop = '32px';
  }

  // 공고 찾기는 data/jobs.json을 받아와야 목록이 생긴다 — 렌더될 때까지 기다렸다가 찍는다.
  if (f.view === 'feed') {
    doc.querySelector('[data-nav="feed"]').click();
    // 설명 문구는 헤드라인이 이미 하는 말이다 — 접어서 공고 카드를 세 장까지 올린다.
    hide(doc, '#view-feed > h2'); hide(doc, '#view-feed > p.hint');
    var tries = 0;
    var waitFeed = setInterval(function () {
      if (doc.querySelector('.feed-card') || ++tries > 60) {
        clearInterval(waitFeed);
        setTimeout(function () { window.__frameReady = true; }, 260);
      }
    }, 50);
    return;
  }

  setTimeout(function () { window.__frameReady = true; }, 260);
});
iframe.src = '../docs/index.html';
</script>
</body>
</html>
